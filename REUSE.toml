# Lizenz-Zuordnung für ganze Verzeichnisse (REUSE-Spezifikation 3.3).
# Spätere Einträge überschreiben frühere, wenn ein Pfad mehrfach passt.
version = 1

# Standard: eigener Code, Specs, Configs
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The NazoOS Contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Nutzer-Dokumentation
[[annotations]]
path = "docs/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The NazoOS Contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Kernel-Patches
[[annotations]]
path = "kernel/patches/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The NazoOS Contributors"
SPDX-License-Identifier = "GPL-2.0-only"
