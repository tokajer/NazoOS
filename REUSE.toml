# SPDX-License-Identifier: GPL-3.0-or-later

# License mapping for whole directories (REUSE specification 3.3).
# If a path matches several entries, the last one wins.
version = 1

# Default: own code, specs, configs
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The NazoOS Contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# User documentation
[[annotations]]
path = "docs/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The NazoOS Contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Kernel patches: written by Linux/CachyOS developers (see each patch
# header), refreshed by NazoOS. "override": the SPDX lines inside the
# patches belong to the patched kernel files, not to the patch files
[[annotations]]
path = "kernel/patches/**"
precedence = "override"
SPDX-FileCopyrightText = ["The Linux kernel and CachyOS contributors (see patch headers)", "2026 The NazoOS Contributors"]
SPDX-License-Identifier = "GPL-2.0-only"

# Legal notices (documentation, not code)
[[annotations]]
path = ["TRADEMARK.md", "DISCLAIMER.md",
        "packages/nazoos-calamares-config/branding/nazoos/disclaimer.html"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The NazoOS Contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Artwork: wallpaper
[[annotations]]
path = "packages/nazoos-branding/wallpaper/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The NazoOS Contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Artwork: logo (also a mark, see TRADEMARK.md)
[[annotations]]
path = "packages/nazoos-branding/logo/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The NazoOS Contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"
