# OBS SCM/CI-Integration: Push auf main → Quellen in :devel neu holen und bauen.
# Doku: https://openbuildservice.org/help/manuals/obs-user-guide/cha-obs-scm-ci-workflow-integration

devel_build:
  steps:
    - trigger_services:
        project: home:Tokajer:nazoos:devel
        package: nazoos-tweaks
  filters:
    event: push
    branches:
      only:
        - main
