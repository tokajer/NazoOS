#
# OBS SCM/CI integration: push to main → refetch sources in :devel and rebuild.
# Doku: https://openbuildservice.org/help/manuals/obs-user-guide/cha-obs-scm-ci-workflow-integration

devel_build:
  steps:
    - trigger_services:
        project: home:Tokajer:nazoos:devel
        package: nazoos-tweaks
    - trigger_services:
        project: home:Tokajer:nazoos:devel
        package: nazoos-pattern
    - trigger_services:
        project: home:Tokajer:nazoos:devel
        package: nazoos-branding
    - trigger_services:
        project: home:Tokajer:nazoos:devel
        package: nazoos-calamares-config
    - trigger_services:
        project: home:Tokajer:nazoos:devel
        package: nazoos-welcome
    - trigger_services:
        project: home:Tokajer:nazoos:devel
        package: nazoos-update
    - trigger_services:
        project: home:Tokajer:nazoos:devel
        package: btrfs-assistant
    - trigger_services:
        project: home:Tokajer:nazoos:devel
        package: nazoos-kernel-only
    - trigger_services:
        project: home:Tokajer:nazoos:devel
        package: dmemcg-booster
    - trigger_services:
        project: home:Tokajer:nazoos:devel
        package: plasma-foreground-booster
  filters:
    event: push
    branches:
      only:
        - main
