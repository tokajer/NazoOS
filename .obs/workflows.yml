#
# OBS SCM/CI integration: push to main → refetch sources in :devel and rebuild.
# Doku: https://openbuildservice.org/help/manuals/obs-user-guide/cha-obs-scm-ci-workflow-integration
# The order is the release order (release.yml stops at the first failure):
# every package after the ones it Requires, checked by
# tests/test_release_packages.py

devel_build:
  steps:
    - trigger_services:
        project: home:Tokajer:nazoos:devel
        package: nazoos-tweaks
    - trigger_services:
        project: home:Tokajer:nazoos:devel
        package: nazoos-repos
    - trigger_services:
        project: home:Tokajer:nazoos:devel
        package: nazoos-branding
    - trigger_services:
        project: home:Tokajer:nazoos:devel
        package: nazoos-pattern
    - trigger_services:
        project: home:Tokajer:nazoos:devel
        package: nazoos-common
    - trigger_services:
        project: home:Tokajer:nazoos:devel
        package: nazoos-welcome
    - trigger_services:
        project: home:Tokajer:nazoos:devel
        package: nazoos-update
    - trigger_services:
        project: home:Tokajer:nazoos:devel
        package: btrfs-assistant
    - trigger_services:
        project: home:Tokajer:nazoos:devel
        package: nazoos-kernel-only
    - trigger_services:
        project: home:Tokajer:nazoos:devel
        package: dmemcg-booster
    - trigger_services:
        project: home:Tokajer:nazoos:devel
        package: plasma-foreground-booster
    - trigger_services:
        project: home:Tokajer:nazoos:devel
        package: artcraft-launcher
    - trigger_services:
        project: home:Tokajer:nazoos:devel
        package: game-devices-udev
    - trigger_services:
        project: home:Tokajer:nazoos:devel
        package: nazoos-binder
    - trigger_services:
        project: home:Tokajer:nazoos:devel
        package: nazoos-session
    - trigger_services:
        project: home:Tokajer:nazoos:devel
        package: nazoos-calamares-config
    - trigger_services:
        project: home:Tokajer:nazoos:devel
        package: nazoos-deck
    - trigger_services:
        project: home:Tokajer:nazoos:devel
        package: nazoos-image
    # Kernel module for kernel-nazoos only: built in :kernel (kernel-syms
    # with the nazoos flavor)
    - trigger_services:
        project: home:Tokajer:nazoos:kernel
        package: acpi_call
  filters:
    event: push
    branches:
      only:
        - main
