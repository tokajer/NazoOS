#
# NazoOS: Valve's fan control and audio DSP services only run on a Steam
# Deck (LCD = Jupiter, OLED = Galileo). On other handhelds they would
# restart in a loop or install the wrong audio profile.
# "|" = at least one of these must match (systemd.unit(5), Conditions)
[Unit]
ConditionFirmware=smbios-field(sys_vendor = Valve)
ConditionFirmware=|smbios-field(product_name = Jupiter)
ConditionFirmware=|smbios-field(product_name = Galileo)
