#
# NazoOS: these services copy Valve's audio configuration to /etc. On a
# read-only snapshot it is there already and the copy would fail: skip the
# service instead of listing it as failed on the Repair page.
# test -w: a btrfs read-only snapshot still shows rw for
# ConditionPathIsReadWrite (statvfs); access(2) gets EROFS.
[Service]
ExecCondition=/usr/bin/test -w /etc
