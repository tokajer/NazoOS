#
# NazoOS: own session entries first. SDDM merges the directories by file
# name and reads each entry from the first directory that has it, so the
# gaming mode entry gets a clear name and its duplicate is hidden.
[Wayland]
SessionDir=/usr/share/nazoos-session/wayland-sessions,/usr/local/share/wayland-sessions,/usr/share/wayland-sessions
