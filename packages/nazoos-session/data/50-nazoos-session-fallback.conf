#
# NazoOS gaming mode: if gamescope does not come up (no Vulkan GPU, broken
# driver), the next login goes to the desktop instead of a login loop.
# ExecStopPost runs before the unit counts as stopped, so the session
# wrapper (systemctl --wait start) and SDDM wait for it.
# Docs: https://www.freedesktop.org/software/systemd/man/latest/systemd.service.html#ExecStopPost=
[Service]
ExecStopPost=/usr/bin/nazoos-session-select --stopped gaming %n
