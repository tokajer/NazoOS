#
# The Wayland greeter exits with code 0 after a VT switch away from it;
# SDDM treats that as success (HELPER_SUCCESS) and does not restart it:
# https://github.com/sddm/sddm/blob/develop/src/daemon/Greeter.cpp
# This runs for every user manager; the script only acts for the sddm user.
# "+": user@.service runs as that user, starting a system unit needs root.
[Service]
ExecStopPost=-+/usr/libexec/nazoos-session/nazoos-greeter-restore trigger %i
