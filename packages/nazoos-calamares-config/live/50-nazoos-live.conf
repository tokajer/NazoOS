#
# Live session: autologin into Plasma (Wayland). The user itself comes
# from DISPLAYMANAGER_AUTOLOGIN in /etc/sysconfig/displaymanager, which
# overrides Autologin/User on openSUSE (set by the KIWI live profile).
[Autologin]
Session=plasma
