#
# Partitioning: btrfs only (needed for Snapper rollback), no swap
# partition (NazoOS uses zram), UEFI with a 512 MiB EFI partition
---
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 512MiB
  minimumSize: 256MiB
  label: "EFI"

userSwapChoices:
  - none
initialSwapChoice: none

defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs" ]

drawNestedPartitions: false
alwaysShowPartitionLabels: true
initialPartitioningChoice: none
# Encryption ("Encrypt system", ADR 0006): /boot stays on the encrypted
# root btrfs, GRUB unlocks it (nazoos-postinstall sets
# GRUB_ENABLE_CRYPTODISK). LUKS1: GRUB cannot open LUKS2 with Argon2,
# the cryptsetup default. No keyfile: openSUSE's grub2 hands the key to
# the initrd (crypttab_entry), the passphrase is asked once.
enableLuksAutomatedPartitioning: true
luksGeneration: luks1
