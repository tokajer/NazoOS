#
# Runs on the host before unpackfs: /var gets no copy-on-write
# (databases, VM images, logs), like the KIWI image. Only affects files
# created afterwards, so it must run before the system is copied.
---
dontChroot: true
timeout: 30
script:
  - "chattr +C ${ROOT}/var"
