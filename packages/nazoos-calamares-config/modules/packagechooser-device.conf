#
# Device page: one image for every computer, the installer adapts the
# system. The choice ends up in GlobalStorage as packagechooser_device
# ("desktop" or "handheld") and is passed to nazoos-postinstall
# (shellprocess-nazoos.conf). On a handheld the installer starter
# preselects "handheld" (/etc/calamares/modules/ copy of this file).
# Docs: https://codeberg.org/Calamares/calamares/src/branch/calamares/src/modules/packagechooser/packagechooser.conf
---
mode: required
method: legacy

labels:
  step: "Device"
  step[de]: "Gerät"

default: desktop

items:
  - id: desktop
    name: "Desktop PC or laptop"
    name[de]: "Desktop-PC oder Laptop"
    description: "Starts with the login screen and the Plasma desktop. Steam's gaming mode is available as a session on the login screen and in the menu (\"Gaming Mode\"). Living room PC: you can start in gaming mode later in NazoOS Welcome."
    description[de]: "Startet mit dem Anmeldebildschirm und dem Plasma-Desktop. Steams Gaming-Modus gibt es als Sitzung auf dem Anmeldebildschirm und im Menü („Gaming-Modus“). Wohnzimmer-PC: Der Start im Gaming-Modus lässt sich später in NazoOS Willkommen einschalten."
    screenshot: "/usr/share/calamares/branding/nazoos/device-desktop.svg"
  - id: handheld
    name: "Handheld (Steam Deck, ROG Ally, Legion Go, ...)"
    name[de]: "Handheld (Steam Deck, ROG Ally, Legion Go, …)"
    description: "Starts directly in Steam's gaming mode, like SteamOS. Adds controller, fan and audio support for handhelds and an on-screen keyboard. \"Switch to Desktop\" in Steam's power menu opens the Plasma desktop."
    description[de]: "Startet direkt in Steams Gaming-Modus, wie SteamOS. Mit Controller-, Lüfter- und Audio-Unterstützung für Handhelds und Bildschirmtastatur. „Zum Desktop wechseln“ im Ein/Aus-Menü von Steam öffnet den Plasma-Desktop."
    screenshot: "/usr/share/calamares/branding/nazoos/device-handheld.svg"
