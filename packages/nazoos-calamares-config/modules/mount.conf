#
# Mounts during installation. btrfs layout like openSUSE: everything
# lives below the subvolume @; subvolumes other than @ itself are not part
# of root snapshots, so a rollback does not touch /home etc.
# /.snapshots is created later by snapper (shellprocess-nazoos.conf).
---
extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: /dev
    mountPoint: /dev
    options: [ bind ]
  - device: tmpfs
    fs: tmpfs
    mountPoint: /run
  - device: /run/udev
    mountPoint: /run/udev
    options: [ bind ]
  - device: efivarfs
    fs: efivarfs
    mountPoint: /sys/firmware/efi/efivars
    efi: true

# Order matters: @ must come first, the others are created inside it
btrfsSubvolumes:
  - mountPoint: /
    subvolume: /@
  - mountPoint: /home
    subvolume: /@/home
  - mountPoint: /root
    subvolume: /@/root
  - mountPoint: /opt
    subvolume: /@/opt
  - mountPoint: /srv
    subvolume: /@/srv
  - mountPoint: /usr/local
    subvolume: /@/usr/local
  - mountPoint: /var
    subvolume: /@/var
  - mountPoint: /boot/grub2/x86_64-efi
    subvolume: /@/boot/grub2/x86_64-efi

mountOptions:
  - filesystem: default
    options: [ defaults ]
  - filesystem: btrfs
    options: [ defaults, noatime, compress=zstd:1 ]
  - filesystem: efi
    options: [ defaults, umask=0077 ]
