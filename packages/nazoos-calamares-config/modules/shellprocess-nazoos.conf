#
# Runs inside the installed system at the end: btrfs default subvolume,
# Snapper, bootloader (shim/Secure Boot) and initrd.
# See scripts/nazoos-postinstall.
---
dontChroot: false
timeout: 900
script:
  - command: "/usr/libexec/nazoos-calamares/nazoos-postinstall"
    timeout: 900
