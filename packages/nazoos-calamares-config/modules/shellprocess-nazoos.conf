#
# Runs inside the installed system at the end: btrfs default subvolume,
# Snapper, bootloader (shim/Secure Boot) and initrd; desktop or handheld.
# See scripts/nazoos-postinstall. Arguments: the device page's choice
# (GlobalStorage key packagechooser_device) and the new user's name.
---
dontChroot: false
timeout: 900
script:
  - command: "/usr/libexec/nazoos-calamares/nazoos-postinstall ${gs[packagechooser_device]} ${USER}"
    timeout: 900
