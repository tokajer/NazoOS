# Start page: system requirements
---
showSupportUrl: true
showKnownIssuesUrl: true
showReleaseNotesUrl: false
showDonateUrl: false

requirements:
  requiredStorage: 30
  # GiB, compared with MemTotal: firmware and kernel keep a part, a PC
  # with 4 GB shows about 3.7 (a VM with 4096 MiB about 3.8)
  requiredRam: 3.5
  # Offline install from the live medium, internet is optional
  internetCheckUrl: https://download.opensuse.org
  check:
    - storage
    - ram
    - power
    - internet
    - root
    - screen
  required:
    - storage
    - ram
    - root
