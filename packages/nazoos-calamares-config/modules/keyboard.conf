#
# Keyboard layout (written to vconsole and X11/Wayland keyboard config)
---
xOrgConfFileName: "/etc/X11/xorg.conf.d/00-keyboard.conf"
convertedKeymapPath: "/usr/share/kbd/keymaps/xkb"
writeEtcDefaultKeyboard: false
# Switch the live session's layout through org.freedesktop.locale1, so
# passwords and the LUKS passphrase are typed with the chosen layout
# (KWin follows locale1 in the live session, KIWI config.sh). Calamares'
# default is "not xcb"; set it explicitly, Calamares may run on Xwayland
useLocale1: true
