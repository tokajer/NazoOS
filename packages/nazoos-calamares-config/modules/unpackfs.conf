#
# Copy the system from the live medium. KIWI live ISOs (kiwi-live dracut
# module) mount the read-only system at /run/overlay/rootfsbase (older
# KIWI: /run/rootfsbase; Tumbleweed's calamares package uses the new
# path too). The live overlay with changes of the live session is not
# copied.
---
unpack:
  - source: "/run/overlay/rootfsbase"
    sourcefs: "file"
    destination: ""
    # Live-only dracut config (adds the kiwi-live module); the installed
    # system builds its own initrd
    exclude: [ "/etc/dracut.conf.d/02-livecd.conf" ]
