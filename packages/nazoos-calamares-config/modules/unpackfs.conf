#
# Copy the system from the live medium.
# UNTESTED: KIWI live ISOs (dracut dmsquash-live) mount the read-only
# system image at /run/rootfsbase; check this path on the first ISO.
---
unpack:
  - source: "/run/rootfsbase"
    sourcefs: "file"
    destination: ""
