#
# First user, in wheel: sudo and Polkit dialogs ask for the user's own
# password (sudo-policy-wheel-auth-self, nazoos-pattern). No root password:
# root stays locked as in the live image, like Fedora (ADR 0032).
---
defaultGroups:
  - name: users
    must_exist: true
    system: true
  - name: wheel
    must_exist: false
    system: true
  - video
  - audio
  # created by nazoos-tweaks (sysusers.d); DDC/CI and OpenRGB SMBus access
  - name: i2c
    must_exist: false
    system: true
  # created by gamemode (sysusers.d); limits.d lets members renice games
  - name: gamemode
    must_exist: false
    system: true

autologinGroup: autologin
doAutologin: false
setRootPassword: false
doReusePassword: false

passwordRequirements:
  minLength: 6
  maxLength: -1

allowWeakPasswords: true
allowWeakPasswordsDefault: false

user:
  shell: /bin/bash
  forbidden_names: [ root, nobody ]

hostname:
  # hostnamed does not work inside the installer chroot
  location: EtcFile
  writeHostsFile: true
  template: "nazoos-${cpu}"
