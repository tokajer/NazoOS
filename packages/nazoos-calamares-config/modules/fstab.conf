#
# /etc/fstab of the installed system. Mount options come from mount.conf.
# The subvol= option of / is removed later (shellprocess-nazoos.conf),
# so / follows the btrfs default subvolume and snapper rollback works.
---
crypttabOptions: luks
# No /tmp line: Tumbleweed mounts /tmp as tmpfs via systemd (tmp.mount)
tmpOptions:
  default:
    tmpfs: false
