#
# NazoOS Calamares main configuration: which pages are shown and which
# jobs run in which order. Docs: https://calamares.io/docs/
---
modules-search: [ local, /usr/lib64/calamares/modules ]

# Module instances with their own config file (modules/<id>.conf)
instances:
  - id: nocow
    module: shellprocess
    config: shellprocess-nocow.conf
  - id: nazoos
    module: shellprocess
    config: shellprocess-nazoos.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      # /var without copy-on-write, before files are copied (like KIWI)
      - shellprocess@nocow
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - networkcfg
      - hwclock
      # Snapper, default subvolume, bootloader, initrd, remove live-only
      # packages (done in the script, not the packages module, because the
      # script itself is part of a live-only package)
      - shellprocess@nazoos
      - umount
  - show:
      - finished

branding: nazoos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
