<?xml version="1.0"?> <!--*-nxml-*-->
<!DOCTYPE busconfig PUBLIC
        "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
        "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
SPDX-FileCopyrightText: 2026 The NazoOS Contributors
SPDX-License-Identifier: GPL-3.0-or-later

Lets every user talk to ratbagd (Piper: mouse DPI, buttons, LEDs).
openSUSE builds libratbag with dbus-group=games, so Piper shows
"Connection to ratbagd failed" unless the user is in group games.
Upstream's default (empty dbus-group) grants all users access; this
restores it without touching user groups, so it also reaches existing
installs and users created later in System Settings.
-->
<busconfig>

        <policy context="default">
                <allow send_destination="org.freedesktop.ratbag1"/>
                <allow receive_sender="org.freedesktop.ratbag1"/>
        </policy>

</busconfig>
