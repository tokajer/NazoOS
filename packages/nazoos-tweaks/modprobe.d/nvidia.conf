# NazoOS: Nvidia driver options. Ignored when no Nvidia driver is installed.
# Put your own options into /etc/modprobe.d/; this file is overwritten
# on updates.

# Use the CPU's page attribute table for memory mappings (faster than MTRR);
# interrupt locking mode that improves frame pacing.
# NVreg_InitializeSystemMemoryAllocations stays at the driver default (zero
# freed memory): NVIDIA advises 0 only for single-user, trusted systems, as
# otherwise memory freed by other programs can reach any GPU client (also
# Flatpak apps), and the gain is negligible
options nvidia NVreg_UsePageAttributeTable=1 NVreg_RegistryDwords=RMIntrLockingMode=1

# Kernel modesetting + framebuffer: required for Wayland and a smooth boot
options nvidia_drm modeset=1 fbdev=1
