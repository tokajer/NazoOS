#
# NazoOS: Nvidia driver options. Ignored when no Nvidia driver is installed.
# Put your own options into /etc/modprobe.d/; this file is overwritten
# on updates.

# Interrupt locking mode that improves frame pacing.
# NVreg_UsePageAttributeTable is not set: the open kernel module (the only
# one NazoOS ships, G07) does not know it and logs "unknown parameter",
# it always maps with PAT. NVreg_InitializeSystemMemoryAllocations stays
# at the driver default (zero freed memory): NVIDIA advises 0 only for
# single-user, trusted systems, as otherwise memory freed by other programs
# can reach any GPU client (also Flatpak apps), and the gain is negligible
options nvidia NVreg_RegistryDwords=RMIntrLockingMode=1

# Kernel modesetting + framebuffer: required for Wayland and a smooth boot
options nvidia_drm modeset=1 fbdev=1
