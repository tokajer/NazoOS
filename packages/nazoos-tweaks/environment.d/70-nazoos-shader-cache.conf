#
# NazoOS: larger shader caches for the user session (systemd environment.d).
# Default caches are too small for big games: shaders get evicted and
# recompiled, which causes stutter.

# Mesa (AMD, Intel)
MESA_SHADER_CACHE_MAX_SIZE=12G
# Nvidia proprietary/open driver
__GL_SHADER_DISK_CACHE_SIZE=12000000000
__GL_SHADER_DISK_CACHE_SKIP_CLEANUP=1
