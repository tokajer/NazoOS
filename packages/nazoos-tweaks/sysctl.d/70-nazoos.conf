#
# NazoOS: kernel parameters for gaming and desktop responsiveness.
# Put your own values into /etc/sysctl.d/99-*.conf; this file is
# overwritten on updates.

# Some games (e.g. via Proton) need a very large number of memory mappings
vm.max_map_count = 2147483642

# Disable split lock mitigation: avoids stutter in older games
kernel.split_lock_mitigate = 0

# Tuned for zram: swap early into compressed RAM,
# read pages one at a time instead of in clusters
vm.swappiness = 100
vm.page-cluster = 0

# Keep directory/inode cache longer
vm.vfs_cache_pressure = 50

# Disable NMI watchdog: saves interrupts and a bit of power
kernel.nmi_watchdog = 0

# Limit the write cache by fixed size instead of % of RAM,
# so large copies don't freeze the system
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864

# TCP BBR + fair queueing: higher throughput and lower latency on lossy
# or busy links (downloads, game streaming)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
