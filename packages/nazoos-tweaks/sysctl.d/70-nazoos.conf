# NazoOS: Kernel-Parameter für Gaming und Desktop-Reaktionszeit.
# Eigene Werte bitte in /etc/sysctl.d/99-*.conf setzen; diese Datei
# wird bei Updates überschrieben.

# Manche Spiele (z. B. über Proton) brauchen sehr viele Speicher-Mappings
vm.max_map_count = 2147483642

# Split-Lock-Bremse aus: verhindert Ruckler bei älteren Spielen
kernel.split_lock_mitigate = 0

# Auf zram abgestimmt: früh in komprimierten RAM auslagern,
# Seiten einzeln statt in Gruppen einlesen
vm.swappiness = 100
vm.page-cluster = 0

# Verzeichnis-/Inode-Cache länger behalten
vm.vfs_cache_pressure = 50

# NMI-Watchdog aus: spart Interrupts und etwas Strom
kernel.nmi_watchdog = 0

# Schreibcache in festen Größen statt in % des RAMs begrenzen,
# damit große Kopiervorgänge das System nicht einfrieren
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
