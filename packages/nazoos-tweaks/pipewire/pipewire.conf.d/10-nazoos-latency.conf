# Lower the default buffer size: 512 samples at 48 kHz = 10.7 ms (upstream: 1024).
# Only affects clients that do not request a latency themselves;
# PipeWire still lowers the quantum when an app asks for less.
context.properties = {
    default.clock.quantum = 512
}
