# zswap is redundant with zram (already compressed RAM) - disable it

w-   /sys/module/zswap/parameters/enabled    -     -    -      -     N

# MGLRU: keep the working set of the last 1000 ms in RAM; under memory
# pressure the kernel kills a process (OOM) instead of thrashing
w-   /sys/kernel/mm/lru_gen/min_ttl_ms       -     -    -      -     1000

# Transparent huge pages: never stall an allocation to defragment memory;
# defragment in the background (kcompactd) instead, synchronously only for
# programs that ask for it via madvise
w-   /sys/kernel/mm/transparent_hugepage/defrag  -  -    -      -     defer+madvise
