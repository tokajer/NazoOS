#
# NazoOS: give VT 1 to the display manager.
# The SDDM Wayland greeter takes the first VT that logind reports as free.
# An idle getty on tty1 is no logind session, so both end up on VT 1 and
# the greeter dies at boot (black screen). openSUSE only conflicts with
# getty@tty7 (X11 greeter, MinimumVT=7). Text consoles stay on Ctrl+Alt+F2+.
[Unit]
Conflicts=getty@tty1.service
After=getty@tty1.service
