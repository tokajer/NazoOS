;
; NazoOS: system-wide GameMode defaults. Override per user in
; ~/.config/gamemode.ini. Reference: /usr/share/doc/packages/gamemode
; or https://github.com/FeralInteractive/gamemode/blob/master/example/gamemode.ini

[general]
; Raise the game's CPU priority (nice -10)
renice=10
; Highest best-effort I/O priority for the game
ioprio=0
; SCHED_ISO only with 4+ cores, on kernels that support it
softrealtime=auto
; No screensaver/lock while playing
inhibit_screensaver=1

; GPU tweaks stay off: they need a fixed device index and can
; overclock or change power limits
