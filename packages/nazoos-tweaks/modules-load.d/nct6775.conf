# Nuvoton Super-I/O hardware monitor (fan speeds, PWM, board temperatures)
# found on most ASRock, ASUS and MSI boards. The chip is not enumerated, so
# udev never loads the driver; without it CoolerControl sees no fans.
# On boards without such a chip the probe fails and nothing is bound.
nct6775
