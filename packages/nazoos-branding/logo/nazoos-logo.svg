<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>NazoOS logo</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#1E2B27"/><stop offset="1" stop-color="#0D1214"/>
    </radialGradient>
    <linearGradient id="letter" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1F7A3A"/><stop offset="1" stop-color="#5FD27A"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <circle cx="256" cy="256" r="244" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#2FA34F" stroke-width="14"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#3E6E9E" stroke-width="2" opacity=".6"/>

  <!-- "N" as a path (no font needed at render time) -->
  <path d="M160,370 V142 H214 L298,280 V142 H352 V370 H298 L214,232 V370 Z" fill="url(#letter)"/>
  <path d="M160,370 V142 H214 L298,280 V142 H352 V370 H298 L214,232 V370 Z" fill="none" stroke="#0D1214" stroke-opacity=".5" stroke-width="2"/>
</svg>
