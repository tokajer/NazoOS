<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>NazoOS logo</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#1E2B27"/><stop offset="1" stop-color="#0D1214"/>
    </radialGradient>
    <linearGradient id="zoro" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1F7A3A"/><stop offset="1" stop-color="#5FD27A"/>
    </linearGradient>
    <linearGradient id="nanami" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#F2E6CC"/><stop offset="1" stop-color="#C8AE7E"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- leopard print (Nanami's tie) -->
    <pattern id="leopard" width="30" height="26" patternUnits="userSpaceOnUse">
      <rect width="30" height="26" fill="#D8B27A"/>
      <g fill="#A87A44"><ellipse cx="8" cy="7" rx="4" ry="3"/><ellipse cx="23" cy="19" rx="3.5" ry="3"/></g>
      <g fill="none" stroke="#2E1E10" stroke-width="2.2" stroke-linecap="round">
        <path d="M3,6 Q4,2 8,2.5"/><path d="M11,3 Q14,6 12,10"/><path d="M9,12 Q5,12 4,9"/>
        <path d="M18,17 Q19,14 23,14.5"/><path d="M26,15 Q29,18 27,22"/><path d="M24,24 Q20,24 19,21"/>
      </g>
      <g fill="#2E1E10"><circle cx="18" cy="6" r="1.4"/><circle cx="5" cy="20" r="1.6"/><circle cx="12" cy="22" r="1.1"/><circle cx="27" cy="9" r="1.2"/></g>
    </pattern>
    <pattern id="leopard-s" href="#leopard" patternTransform="scale(.45)"/>
  </defs>

  <!-- badge -->
  <circle cx="256" cy="256" r="244" fill="url(#bg)"/>
  <!-- 7:3 ring (Nanami's ratio): 70 % Zoro green, 30 % Nanami leopard -->
  <g transform="rotate(-90 256 256)" fill="none" stroke-width="14">
    <circle cx="256" cy="256" r="226" stroke="#2FA34F" stroke-dasharray="994 427"/>
    <circle cx="256" cy="256" r="226" stroke="url(#leopard)" stroke-dasharray="421 1000" stroke-dashoffset="-998"/>
  </g>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#3E6E9E" stroke-width="2" opacity=".6"/>

