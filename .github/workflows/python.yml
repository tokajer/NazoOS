#
# Lint (ruff) and unit tests (pytest) for the Python code of
# nazoos-common, nazoos-welcome and nazoos-update (ADR 0030), plus the
# nazoos-session-ctl script (tests/test_session_ctl.py).
# Settings: pyproject.toml. Locally: pip install pytest ruff
# PySide6-Essentials, then "ruff check ." and "pytest".
# Doku: https://docs.astral.sh/ruff/ , https://docs.pytest.org/

name: Python

on:
  push:
    branches: [main]
    paths:
      - "packages/nazoos-common/**"
      - "packages/nazoos-welcome/**"
      - "packages/nazoos-update/**"
      - "packages/nazoos-session/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/python.yml"
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Tumbleweed's python3
          python-version: "3.13"
      - name: Install tools
        # PySide6 only for tests/test_qt.py (QCoreApplication, no display).
        # QtGui (imported by the backends) links EGL/GL, xkbcommon and
        # fontconfig even without a display; the runner image lacks libEGL
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1
          pip install pytest ruff PySide6-Essentials
      - name: ruff
        run: ruff check --output-format github .
      - name: pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v
