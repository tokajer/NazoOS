#
# Builds and publishes the release ISO (ADR 0025). Build and publishing of
# repository "images" in home:Tokajer:nazoos:release stay disabled, so the
# last built ISO is frozen: built against openSUSE:Factory/snapshot it is
# often one snapshot ahead of the mirrors, and an ISO OBS rebuilt on every
# snapshot never became publishable (2026-10-24).
# Every hour (.github/scripts/release-iso-check.py decides):
# - ISO missing or stale (older NazoOS packages than :release, or its
#   Tumbleweed snapshot a week behind the mirrors): enable the build and
#   start a rebuild; a later run disables the build again when it is done.
# - Frozen ISO not published yet and the mirrors have its snapshot:
#   enable publishing, wait until download.opensuse.org serves that ISO,
#   disable publishing again.
# Tumbleweed is rolling, so the ISO may follow it; only our packages go
# through the release gate (release.yml).
# Secrets: OBS_USER/OBS_PASSWORD – tokajer-bot, maintainer of
# home:Tokajer:nazoos:release (set_flag and rebuild need maintainer rights).
# Doku: https://openbuildservice.org/help/manuals/obs-user-guide/ (flags)

name: Release ISO

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  workflow_call:
    secrets:
      OBS_USER:
        required: true
      OBS_PASSWORD:
        required: true

concurrency:
  group: release-iso
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      FLAG_URL: "https://api.opensuse.org/source/home:Tokajer:nazoos:release?cmd=set_flag&flag=publish&repository=images"
      BUILD_FLAG_URL: "https://api.opensuse.org/source/home:Tokajer:nazoos:release?cmd=set_flag&flag=build&repository=images"
      REBUILD_URL: "https://api.opensuse.org/build/home:Tokajer:nazoos:release?cmd=rebuild&package=nazoos-image:release&repository=images&arch=x86_64"
      RESULT_URL: "https://api.opensuse.org/build/home:Tokajer:nazoos:release/_result?package=nazoos-image:release&repository=images&multibuild=1"
      PUBLISHED: "https://download.opensuse.org/repositories/home:/Tokajer:/nazoos:/release/images/iso/NazoOS.x86_64-release.iso.sha256"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check the built ISO
        id: check
        env:
          OBS_USER: ${{ secrets.OBS_USER }}
          OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
        run: |
          [ -n "$OBS_USER" ] && [ -n "$OBS_PASSWORD" ] ||
            { echo "::error::secrets OBS_USER / OBS_PASSWORD missing"; exit 1; }
          python3 .github/scripts/release-iso-check.py | tee -a "$GITHUB_OUTPUT"

      - name: Freeze the finished ISO
        if: steps.check.outputs.build == 'disable'
        env:
          OBS_USER: ${{ secrets.OBS_USER }}
          OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
        run: |
          .github/scripts/obs-curl.sh -sS --fail-with-body -X POST "$BUILD_FLAG_URL&status=disable"

      # The rebuilt ISO is frozen by a later run, publishing waits for it
      - name: Rebuild the ISO
        if: steps.check.outputs.build == 'enable'
        env:
          OBS_USER: ${{ secrets.OBS_USER }}
          OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
          REASON: ${{ steps.check.outputs.reason }}
        run: |
          .github/scripts/obs-curl.sh -sS --fail-with-body -X POST "$BUILD_FLAG_URL&status=enable"
          .github/scripts/obs-curl.sh -sS --fail-with-body -X POST "$REBUILD_URL"
          # Until the scheduler has taken it, _result still says
          # "succeeded" for the old ISO and the next run would freeze it
          for _ in $(seq 30); do
            sleep 30
            if ! .github/scripts/obs-curl.sh -sSf "$RESULT_URL" |
                grep -Eq 'code="(succeeded|disabled)"'; then
              echo "## Release ISO rebuilding" >> "$GITHUB_STEP_SUMMARY"
              echo "$REASON" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "::error::OBS did not start the image rebuild within 15 minutes"
          exit 1

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        env:
          OBS_USER: ${{ secrets.OBS_USER }}
          OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
          SHA: ${{ steps.check.outputs.sha }}
          REASON: ${{ steps.check.outputs.reason }}
        run: |
          .github/scripts/obs-curl.sh -sS --fail-with-body -X POST "$FLAG_URL&status=enable"
          for _ in $(seq 60); do
            sleep 60
            if [ "$(curl -sfL "$PUBLISHED" | awk '{print $1}')" = "$SHA" ]; then
              echo "## Release ISO published" >> "$GITHUB_STEP_SUMMARY"
              echo "$REASON, sha256 \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "::error::download.opensuse.org did not serve the new ISO within 60 minutes"
          exit 1

      # Always: a failed or cancelled run must not leave publishing on
      - name: Disable publishing again
        if: always() && steps.check.outputs.publish == 'true'
        env:
          OBS_USER: ${{ secrets.OBS_USER }}
          OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
        run: |
          .github/scripts/obs-curl.sh -sS --fail-with-body -X POST "$FLAG_URL&status=disable"

      - name: Summary
        if: steps.check.outputs.publish != 'true' && steps.check.outputs.build != 'enable'
        env:
          REASON: ${{ steps.check.outputs.reason }}
        run: |
          echo "Nothing published: $REASON" >> "$GITHUB_STEP_SUMMARY"
