# SPDX-License-Identifier: GPL-3.0-or-later
#
# Release (ADR 0025): copies the tested binaries of every package from
# home:Tokajer:nazoos:devel to :release via OBS release targets
# (trigger="manual", no rebuild). Run by hand after the VM checklist
# passed on the :devel ISO: Actions → Release → Run workflow.
# :release then builds the release ISO against the new packages;
# release-iso.yml publishes it (mirror rule, ADR 0025).
# Package list = the :devel packages in .obs/workflows.yml, without
# nazoos-image (the ISO has its own package in :release), plus OBS_ONLY:
# packages that live only in OBS (Waydroid stack). New OBS-only package
# in :devel → add it there, else :release misses it.
# OBS allows release tokens only per package, not per project. No
# "repository" parameter: with release targets OBS *skips* the target
# whose repository has that name (app/models/token/release.rb), so
# repository=openSUSE_Tumbleweed released nothing (run 2026-10-17).
# Secrets (maintainer account, plus OBS_USER/OBS_PASSWORD of the kernel
# bot – only to read the :devel build results):
# - OBS_RELEASE_TOKEN: `osc token --create --operation release` (no
#   project/package: valid for every package)
# - OBS_SERVICE_TOKEN: `osc token --create --operation runservice
#   home:Tokajer:nazoos:release nazoos-image` – refetches the KIWI
#   description from main, so the release ISO matches this commit
# Doku: https://openbuildservice.org/help/manuals/obs-user-guide/ (release
# targets, authorization tokens)

name: Release

on:
  workflow_dispatch:
    inputs:
      checklist:
        description: The VM checklist passed on the current :devel ISO
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      SOURCE: home:Tokajer:nazoos:devel
      OBS_ONLY: libgbinder1 libglibutil1 python-gbinder python-pyclip waydroid
    steps:
      - name: Check input
        if: ${{ !inputs.checklist }}
        run: |
          echo "::error::Run the VM checklist on the :devel ISO first, then tick the box"
          exit 1

      - uses: actions/checkout@v7

      # Never release a half-rebuilt :devel (e.g. right after a push, which
      # starts services and builds): wait until every package is finished,
      # stop on failures. Reading needs a login; any account can read.
      - name: Wait until :devel has finished building
        env:
          OBS_USER: ${{ secrets.OBS_USER }}
          OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
        run: |
          [ -n "$OBS_USER" ] && [ -n "$OBS_PASSWORD" ] ||
            { echo "::error::secrets OBS_USER / OBS_PASSWORD missing"; exit 1; }
          for _ in $(seq 60); do
            curl -sS --fail-with-body -u "$OBS_USER:$OBS_PASSWORD" -o result.xml \
              "https://api.opensuse.org/build/$SOURCE/_result?repository=openSUSE_Tumbleweed"
            state=$(python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          ok = {"succeeded", "disabled", "excluded"}
          bad = {"failed", "unresolvable", "broken"}
          res = ET.parse("result.xml").getroot().findall("result")
          codes = {s.get("package"): s.get("code") for r in res for s in r}
          failed = sorted(p for p, c in codes.items() if c in bad)
          if failed:
              print("failed " + " ".join(failed))
          elif res and all(r.get("code") == "published" and not r.get("dirty")
                           for r in res) and set(codes.values()) <= ok:
              print("done")
          else:
              print("busy")
          EOF
            )
            case $state in
              done) echo ":devel finished"; exit 0 ;;
              failed*) echo "::error:::devel has failed packages: ${state#failed }"; exit 1 ;;
            esac
            echo "still building, waiting"
            sleep 60
          done
          echo "::error:::devel did not finish within 60 minutes"
          exit 1

      - name: Refresh the image description in :release
        env:
          TOKEN: ${{ secrets.OBS_SERVICE_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::secret OBS_SERVICE_TOKEN missing"; exit 1; }
          curl -sS --fail-with-body -X POST -H "Authorization: Token $TOKEN" \
            "https://api.opensuse.org/trigger/runservice?project=home:Tokajer:nazoos:release&package=nazoos-image"

      - name: Release packages
        env:
          TOKEN: ${{ secrets.OBS_RELEASE_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::secret OBS_RELEASE_TOKEN missing"; exit 1; }
          mapfile -t packages < <(
            awk -v p="project: $SOURCE" '$0 ~ p"$" { getline; sub(/.*package: */, ""); print }' \
              .obs/workflows.yml | grep -vx nazoos-image
            printf '%s\n' $OBS_ONLY)
          [ "${#packages[@]}" -gt 0 ] || { echo "::error::no packages found"; exit 1; }
          failed=()
          {
            echo "## Release $(date -u +%F) from ${GITHUB_SHA::7}"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for pkg in "${packages[@]}"; do
            if out=$(curl -sS --fail-with-body -X POST \
                -H "Authorization: Token $TOKEN" \
                "https://api.opensuse.org/trigger/release?project=$SOURCE&package=$pkg" 2>&1); then
              echo "- $pkg ✓" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::$pkg: $out"
              echo "- $pkg ✗" >> "$GITHUB_STEP_SUMMARY"
              failed+=("$pkg")
            fi
          done
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'

          The release ISO builds in :release now; the "Release ISO" workflow
          (every 3 hours, or Actions → Release ISO → Run workflow) publishes
          it once it is built and the mirrors have its Tumbleweed snapshot.
          EOF
          [ "${#failed[@]}" -eq 0 ] || exit 1
