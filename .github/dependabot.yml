#
# The actions in .github/workflows are pinned by commit SHA; Dependabot
# proposes the new SHA (and tag comment) when a release comes out.
# Doku: https://docs.github.com/code-security/dependabot/working-with-dependabot/keeping-your-actions-up-to-date-with-dependabot

version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
